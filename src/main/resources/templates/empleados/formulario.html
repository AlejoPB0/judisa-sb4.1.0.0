<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${empleadoId == null} ? 'Nuevo empleado' : 'Editar empleado')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="contenido">
        <header th:replace="~{fragments/layout :: topbar(${empleadoId == null} ? 'Nuevo empleado' : 'Editar empleado')}"></header>

        <div class="tarjeta" style="max-width: 720px">
            <!-- RF-8, RF-9, RF-12, RF-13 -->
            <form th:action="${empleadoId == null} ? @{/empleados} : @{/empleados/{id}(id=${empleadoId})}"
                  th:object="${form}" method="post" novalidate data-un-envio>
                <div class="row g-3">
                    <div class="col-12">
                        <label for="nombre" class="form-label">Nombre completo *</label>
                        <input type="text" th:field="*{nombre}" class="form-control form-control-lg"
                               th:errorclass="is-invalid" maxlength="120" required>
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="documento" class="form-label">Documento *</label>
                        <input type="text" th:field="*{documento}" class="form-control form-control-lg"
                               th:errorclass="is-invalid" inputmode="numeric" maxlength="20" required>
                        <div class="form-text">Solo números, sin puntos.</div>
                        <div class="invalid-feedback" th:errors="*{documento}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="telefono" class="form-label">Teléfono *</label>
                        <input type="tel" th:field="*{telefono}" class="form-control form-control-lg"
                               th:errorclass="is-invalid" inputmode="numeric" maxlength="15" required>
                        <div class="invalid-feedback" th:errors="*{telefono}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="tipoTrabajo" class="form-label">Tipo de trabajo *</label>
                        <select th:field="*{tipoTrabajo}" class="form-select form-select-lg" th:errorclass="is-invalid" required>
                            <option value="">Seleccione…</option>
                            <option th:each="t : ${tiposTrabajo}" th:value="${t}" th:text="${t.nombre}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{tipoTrabajo}"></div>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check2 me-1"></i> Guardar</button>
                    <a th:href="${empleadoId == null} ? @{/empleados} : @{/empleados/{id}(id=${empleadoId})}"
                       class="btn btn-outline-secondary btn-lg">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
