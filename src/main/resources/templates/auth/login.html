<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<main class="pantalla-login">
    <div class="caja-login shadow">
        <div class="text-center mb-4">
            <img th:src="@{/img/logo.svg}" alt="Judisa" width="64" height="64" class="mb-2">
            <h1 class="mb-0">Judisa</h1>
            <p class="text-muted mb-0">Taller Satélite Judisa Jean</p>
        </div>

        <!-- RF-5: mensaje genérico, sin indicar qué dato falló -->
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.bloqueado}" class="alert alert-warning" role="alert">
            <i class="bi bi-lock-fill me-1"></i> Cuenta bloqueada temporalmente por intentos fallidos.
            Intente de nuevo en 15 minutos.
        </div>
        <div th:if="${param.salir}" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> Sesión cerrada correctamente.
        </div>

        <!-- RF-2, RF-4: usuario y contraseña obligatorios -->
        <form th:action="@{/login}" method="post" novalidate id="formLogin" data-un-envio>
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" name="username" class="form-control form-control-lg"
                       autocomplete="username" autofocus required>
                <div class="invalid-feedback">Ingrese su usuario.</div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control form-control-lg"
                       autocomplete="current-password" required>
                <div class="invalid-feedback">Ingrese su contraseña.</div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
            </button>
        </form>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // RF-4: validación en el cliente de campos vacíos
    document.getElementById('formLogin').addEventListener('submit', (e) => {
        let valido = true;
        ['username', 'password'].forEach((id) => {
            const campo = document.getElementById(id);
            const vacio = campo.value.trim() === '';
            campo.classList.toggle('is-invalid', vacio);
            if (vacio) valido = false;
        });
        if (!valido) {
            e.preventDefault();
            e.stopImmediatePropagation();
        }
    }, true);
</script>
</body>
</html>
