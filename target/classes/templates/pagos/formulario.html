<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pagoId == null} ? 'Registrar pago' : 'Editar pago')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="contenido">
        <header th:replace="~{fragments/layout :: topbar(${pagoId == null} ? 'Registrar pago' : 'Editar pago')}"></header>

        <div class="tarjeta" style="max-width: 820px">
            <div th:if="${empleados.isEmpty()}" class="alert alert-info">
                Para registrar un pago necesita al menos un empleado activo. <a th:href="@{/empleados/nuevo}">Crear empleado</a>
            </div>

            <!-- RF-30, RF-31, RF-34, RF-35, RF-36, RF-38 -->
            <form th:action="${pagoId == null} ? @{/pagos} : @{/pagos/{id}(id=${pagoId})}"
                  th:object="${form}" method="post" novalidate data-un-envio data-calculo-pago>
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="empleadoId" class="form-label">Empleado *</label>
                        <select th:field="*{empleadoId}" class="form-select form-select-lg" th:errorclass="is-invalid" required>
                            <option value="">Seleccione…</option>
                            <option th:each="e : ${empleados}" th:value="${e.id}"
                                    th:text="|${e.nombre} · ${e.tipoTrabajoNombre}${e.activo ? '' : ' (inactivo)'}|"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{empleadoId}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="fecha" class="form-label">Fecha *</label>
                        <input type="date" th:field="*{fecha}" th:max="${hoy}" class="form-control form-control-lg"
                               th:errorclass="is-invalid" required>
                        <div class="invalid-feedback" th:errors="*{fecha}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="piezas" class="form-label">Piezas *</label>
                        <input type="number" th:field="*{piezas}" class="form-control form-control-lg" data-piezas
                               th:errorclass="is-invalid" min="1" max="1000000" step="1" inputmode="numeric" required>
                        <div class="invalid-feedback" th:errors="*{piezas}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="valorUnitario" class="form-label">Valor unitario (COP) *</label>
                        <div class="input-group input-group-lg has-validation">
                            <span class="input-group-text">$</span>
                            <input type="number" th:field="*{valorUnitario}" class="form-control" data-valor-unitario
                                   th:errorclass="is-invalid" min="1" step="1" inputmode="numeric" required>
                            <div class="invalid-feedback" th:errors="*{valorUnitario}"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="sugerencia" class="form-label">Tomar valor de una referencia</label>
                        <select id="sugerencia" class="form-select form-select-lg" data-sugerir-valor>
                            <option value="">—</option>
                            <option th:each="r : ${referencias}" th:value="${r.valorUnitario}"
                                    th:text="|${r.codigo} · ${@fmt.cop(r.valorUnitario)}|"></option>
                        </select>
                    </div>
                    <!-- RF-30, RF-36: total calculado automáticamente -->
                    <div class="col-12">
                        <div class="tarjeta tarjeta-costura d-flex align-items-center gap-3 py-3">
                            <i class="bi bi-calculator fs-2 text-cobre"></i>
                            <div>
                                <div class="text-muted small">Total a pagar (piezas × valor unitario)</div>
                                <div class="fs-3 fw-bold" data-total-pago aria-live="polite">$ 0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <span class="form-label d-block">Estado</span>
                        <div class="btn-group" role="group" aria-label="Estado del pago">
                            <th:block th:each="s : ${estados}">
                                <input type="radio" class="btn-check" th:field="*{estado}" th:value="${s}" data-estado-pago>
                                <label class="btn btn-outline-indigo btn-lg" th:for="${#ids.prev('estado')}" th:text="${s.nombre}"></label>
                            </th:block>
                        </div>
                    </div>
                    <div class="col-md-6" data-campo-fecha-efectiva>
                        <label for="fechaPagoEfectivo" class="form-label">Fecha en que se pagó</label>
                        <input type="date" th:field="*{fechaPagoEfectivo}" th:max="${hoy}" class="form-control form-control-lg"
                               th:errorclass="is-invalid">
                        <div class="form-text">Si la deja vacía se usa la fecha del pago.</div>
                        <div class="invalid-feedback" th:errors="*{fechaPagoEfectivo}"></div>
                    </div>
                    <div class="col-12">
                        <label for="nota" class="form-label">Nota</label>
                        <input type="text" th:field="*{nota}" class="form-control" maxlength="300"
                               th:errorclass="is-invalid" placeholder="Opcional: quincena, adelanto, etc.">
                        <div class="invalid-feedback" th:errors="*{nota}"></div>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check2 me-1"></i> Guardar</button>
                    <a th:href="@{/pagos}" class="btn btn-outline-secondary btn-lg">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
