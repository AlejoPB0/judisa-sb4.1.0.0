<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cambiar contraseña')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="contenido">
        <header th:replace="~{fragments/layout :: topbar('Cambiar contraseña')}"></header>

        <div th:if="${obligatorio}" class="alert alert-warning">
            <i class="bi bi-shield-lock-fill me-1"></i>
            Por seguridad, cambie la contraseña inicial antes de usar el sistema.
        </div>

        <div class="tarjeta" style="max-width: 520px">
            <!-- RF-6 -->
            <form th:action="@{/cuenta/password}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label for="passwordActual" class="form-label">Contraseña actual</label>
                    <input type="password" th:field="*{passwordActual}" class="form-control form-control-lg"
                           th:errorclass="is-invalid" autocomplete="current-password">
                    <div class="invalid-feedback" th:errors="*{passwordActual}"></div>
                </div>
                <div class="mb-3">
                    <label for="passwordNueva" class="form-label">Nueva contraseña</label>
                    <input type="password" th:field="*{passwordNueva}" class="form-control form-control-lg"
                           th:errorclass="is-invalid" autocomplete="new-password" minlength="8">
                    <div class="form-text">Mínimo 8 caracteres.</div>
                    <div class="invalid-feedback" th:errors="*{passwordNueva}"></div>
                </div>
                <div class="mb-4">
                    <label for="confirmacion" class="form-label">Confirmar nueva contraseña</label>
                    <input type="password" th:field="*{confirmacion}" class="form-control form-control-lg"
                           th:errorclass="is-invalid" autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{confirmacion}"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check2 me-1"></i> Guardar contraseña</button>
            </form>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
